<!DOCTYPE html>
<html>
<head>
  <title>Rock, Paper, Scissors!</title>
  <link href="Style.css" rel="stylesheet">
</head>
<body>
  <div class="Container">

  <button class="Choice" id="Rock" onclick="
    userChoiceNumber = 1;
    userChoice = 'Rock';
    determineWinner();
    alert(`You Threw: ${userChoice}; The Computer Threw: ${computerChoice}; ${result}`);
    determineWins()
    updateScore()">
    Rock</button>

  <button class="Choice" id="Paper" onclick="
    userChoiceNumber = 2;
    userChoice = 'Paper';
    determineWinner();
    alert(`You Threw: ${userChoice}; The Computer Threw: ${computerChoice}; ${result}`);
    determineWins()
    updateScore()">
    Paper</button>

  <button class="Choice" id="Scissors" onclick="
    userChoiceNumber = 3;
    userChoice = 'Scissors';
    determineWinner();
    alert(`You Threw: ${userChoice}; The Computer Threw: ${computerChoice}; ${result}`);
    determineWins()
    updateScore()">
    Scissors</button>

  </div>
  <p class="js-wins"></p>
  <script src="Script.js"></script>
</body>
</html>
